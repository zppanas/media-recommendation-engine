<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Media Archive</title><link rel="stylesheet" href="/login.css"></head><body><main class="login-shell"><section class="panel login-card"><p class="eyebrow">Media Archive</p><h1>Welcome back</h1><p class="intro">Sign in to your personal archive.</p><form id="login-form"><div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><p id="error" class="error" hidden></p><button class="button" type="submit">Sign in</button></form></section></main><script>document.getElementById('login-form').onsubmit=async e=>{e.preventDefault();const error=document.getElementById('error');error.hidden=true;const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(r.ok){location.href='/app/'}else{error.textContent=r.status===401?'Invalid username or password':'Unable to sign in';error.hidden=false}}</script></body></html>
